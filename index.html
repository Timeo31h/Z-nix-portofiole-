
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio de Timéo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080811;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 65px 20px 45px;
}

header h1 {
    font-size: clamp(35px, 7vw, 65px);
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #9b5cff, #36cfff);
    -webkit-background-clip: text;
    color: transparent;
}

header p {
    color: #aaa;
    margin-top: 15px;
    letter-spacing: 3px;
    font-size: 13px;
}

.gallery {
    width: 90%;
    max-width: 1100px;
    margin: 20px auto 70px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.photo {
    background: #151522;
    border: 1px solid #292941;
    border-radius: 16px;
    overflow: hidden;
    transition: 0.3s;
}

.photo:hover {
    transform: translateY(-6px);
    border-color: #9b5cff;
    box-shadow: 0 0 25px #8b45ff44;
}

.photo img {
    width: 100%;
    display: block;
    object-fit: cover;
}

.photo:last-child {
    grid-column: span 2;
}

footer {
    text-align: center;
    color: #666;
    padding: 25px;
    font-size: 12px;
}

@media(max-width: 650px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .photo:last-child {
        grid-column: span 1;
    }
}
</style>
</head>

<body>

<header>
    <h1>PORTFOLIO DE TIMÉO</h1>
    <p>MES CRÉATIONS</p>
</header>

<main class="gallery">
    <div class="photo"><img src="image1.jpg" alt="Création 1"></div>
    <div class="photo"><img src="image2.jpg" alt="Création 2"></div>
    <div class="photo"><img src="image3.jpg" alt="Création 3"></div>
    <div class="photo"><img src="image4.jpg" alt="Création 4"></div>
    <div class="photo"><img src="image5.jpg" alt="Création 5"></div>
</main>

<footer>© 2026 — Portfolio de Timéo</footer>

</body>
</html>
