
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio de Timéo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080811;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 75px 20px 55px;
}

header h1 {
    font-size: clamp(35px, 7vw, 65px);
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #a855f7, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

header p {
    color: #aaa;
    margin-top: 18px;
    letter-spacing: 5px;
    font-size: 13px;
}

.gallery {
    width: 90%;
    max-width: 1100px;
    margin: 0 auto 70px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.photo {
    background: #151522;
    border: 1px solid #292941;
    border-radius: 16px;
    overflow: hidden;
    transition: 0.3s ease;
}

.photo:hover {
    transform: translateY(-6px);
    border-color: #a855f7;
    box-shadow: 0 0 25px #a855f744;
}

.photo img {
    width: 100%;
    height: auto;
    display: block;
}

.photo:last-child {
    grid-column: span 2;
}

footer {
    text-align: center;
    color: #666;
    padding: 25px;
    font-size: 12px;
}

@media (max-width: 650px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .photo:last-child {
        grid-column: span 1;
    }
}
</style>
</head>

<body>

<header>
    <h1>PORTFOLIO DE TIMÉO</h1>
    <p>MES CRÉATIONS</p>
</header>

<main class="gallery">

    <div class="photo">
        <img src="IMG_0585.jpeg" alt="Création 1">
    </div>

    <div class="photo">
        <img src="IMG_0586.jpeg" alt="Création 2">
    </div>

    <div class="photo">
        <img src="IMG_0589.jpeg" alt="Création 3">
    </div>

    <div class="photo">
        <img src="IMG_0590.jpeg" alt="Création 4">
    </div>

    <div class="photo">
        <img src="IMG_0591.jpeg" alt="Création 5">
    </div>

</main>

<footer>
    © 2026 — Portfolio de Timéo
</footer>

</body>
</html>
